<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rabees — Head study</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#302b25;background:#f3f0e9}*{box-sizing:border-box}body{margin:0;overflow:hidden}#stage{position:absolute;inset:0}canvas{display:block;touch-action:none}header{position:absolute;z-index:2;top:30px;left:36px;pointer-events:none}small{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#776d61}h1{font-size:28px;letter-spacing:-1px;margin:8px 0;font-weight:500}.downloads{position:absolute;top:32px;right:36px;display:flex;gap:8px;z-index:2}button,a{font:inherit;color:inherit;border:1px solid #cfc7bb;background:#ffffffa0;border-radius:30px;padding:11px 17px;font-size:12px;text-decoration:none;cursor:pointer;transition:background .2s}button:hover,a:hover{background:white}button[aria-pressed=true]{background:#302b25;color:#fff;border-color:#302b25}.toolbar{position:absolute;bottom:54px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:2;white-space:nowrap}footer{position:absolute;bottom:23px;text-align:center;width:100%;font-size:11px;color:#82796d;pointer-events:none}.source{position:absolute;left:36px;bottom:32px;width:94px;pointer-events:none}.source img{width:94px;height:114px;object-fit:contain;display:block;margin-bottom:8px}.source small{font-size:8px;letter-spacing:1px}#status{position:absolute;top:50%;left:0;width:100%;text-align:center;color:#82796d;font-size:13px;pointer-events:none}.note{position:absolute;right:36px;bottom:34px;font-size:10px;color:#82796d;line-height:1.7;text-align:right;pointer-events:none} @media(max-width:650px){header{top:22px;left:22px}h1{font-size:24px}.downloads{top:24px;right:20px}.downloads a{padding:10px 13px}.toolbar{bottom:62px;gap:4px}.toolbar button{padding:10px 12px;font-size:11px}.source,.note{display:none}footer{bottom:26px;font-size:10px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
</head><body>
<div id="stage" aria-label="Interactive 3D head. Drag to rotate and move the pointer to guide the eyes."></div>
<header><small>Character study / 01</small><h1>A familiar face.</h1></header>
<div class="downloads"><a href="head-assets/rabees-head.glb" download>Download GLB ↓</a></div>
<div class="source"><img src="head-assets/head-reference.png" alt="Original head reference"><small>The reference</small></div>
<div class="toolbar" role="group" aria-label="Model view"><button data-view="front" aria-pressed="true">Front</button><button data-view="angle" aria-pressed="false">Three-quarter</button><button data-view="back" aria-pressed="false">Back</button><button id="wire" aria-pressed="false">Mesh</button></div>
<div class="note">Reference-matched front<br>Side and back shape reconstructed</div>
<footer>Move your cursor to guide the eyes · Drag to rotate · Scroll to zoom</footer><div id="status">Loading the head…</div>
<script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#f3f0e9');
const camera=new THREE.OrthographicCamera(-2,2,2,-2,.01,100);camera.position.set(0,0,7);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.NoToneMapping;document.querySelector('#stage').append(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0xb2a38b,.7));let key=new THREE.DirectionalLight(0xfff7eb,1.05);key.position.set(-3,4,5);scene.add(key);let fill=new THREE.DirectionalLight(0xffffff,.35);fill.position.set(3,1,2);scene.add(fill);let rim=new THREE.DirectionalLight(0xffffff,1.25);rim.position.set(1,3,-3);scene.add(rim);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.09;controls.enablePan=false;controls.minZoom=.65;controls.maxZoom=1.65;controls.target.set(0,0,0);controls.update();
let model,eyes=[],materials=[],mouse=new THREE.Vector2(),tracking=true,dragging=false,wire=false;
controls.addEventListener('start',()=>{dragging=true;tracking=false;document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed','false'))});controls.addEventListener('end',()=>dragging=false);
const loader=new GLTFLoader();loader.load('head-assets/rabees-head.glb?v=2',g=>{model=g.scene;scene.add(model);model.traverse(o=>{if(o.name.startsWith('Eye_Gaze_'))eyes.push(o);if(o.isMesh){o.material.side=THREE.DoubleSide;materials.push(o.material)}});document.querySelector('#status').remove();renderer.domElement.dataset.modelReady='true';renderer.domElement.dataset.eyePivots=eyes.length},undefined,()=>{document.querySelector('#status').textContent='The model could not load. Please refresh.'});
addEventListener('pointermove',e=>{mouse.set(e.clientX/innerWidth*2-1,1-e.clientY/innerHeight*2)});document.addEventListener('pointerleave',()=>mouse.set(0,0));
for(let b of document.querySelectorAll('[data-view]'))b.addEventListener('click',()=>{const v=b.dataset.view;camera.position.set(v==='angle'?3:0,v==='angle'?.2:0,v==='back'?-7:v==='angle'?6.5:7);camera.zoom=1;camera.updateProjectionMatrix();controls.target.set(0,0,0);controls.update();tracking=v==='front';document.querySelectorAll('[data-view]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));if(model)model.rotation.set(0,0,0)});
document.querySelector('#wire').onclick=e=>{wire=!wire;for(let m of materials)m.wireframe=wire;e.currentTarget.setAttribute('aria-pressed',String(wire))};
function resize(){let aspect=innerWidth/innerHeight,h=innerWidth<650?4.45:3.85;camera.left=-h*aspect/2;camera.right=h*aspect/2;camera.top=h/2;camera.bottom=-h/2;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}addEventListener('resize',resize);resize();
let last=0;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;function frame(now){let dt=Math.min(.05,(now-last)/1000);last=now;let ease=1-Math.exp(-dt*10);if(model){if(tracking&&!dragging&&!reduced){model.rotation.y+=(mouse.x*.075-model.rotation.y)*ease;model.rotation.x+=(-mouse.y*.035-model.rotation.x)*ease;}for(let eye of eyes){eye.rotation.y+=((tracking?mouse.x*.28:0)-eye.rotation.y)*ease;eye.rotation.x+=((tracking?-mouse.y*.19:0)-eye.rotation.x)*ease;}}controls.update();renderer.render(scene,camera);requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
