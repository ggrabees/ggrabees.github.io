<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<section style="background:var(--bg);color:var(--fg);font-family:Geist, sans-serif;padding:clamp(90px,14vh,150px) clamp(24px,5vw,64px) clamp(96px,11vh,120px);border-top:1px solid var(--line)">
  <div style="max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:clamp(40px,6vh,72px)">
    <span style="font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:var(--fg-45)">Contact</span>
    <h2 style="font-size:clamp(30px,6vw,72px);font-weight:500;line-height:1.1;letter-spacing:-0.03em;text-wrap:pretty">Have something worth <br /> making properly?</h2>
    <div style="display:flex;flex-wrap:wrap;align-items:center;gap:20px">
      <a href="Contact.html" style="display:inline-flex;align-items:center;gap:10px;border-radius:8px;background:var(--btn-bg);color:var(--btn-fg);padding:14px 26px;font-size:15px;font-weight:500;transition:transform .2s" style-hover="transform:scale(1.05)">
        Start a project
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
      </a>
    </div>
    <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px;border-top:1px solid var(--line);padding-top:24px">
      <span data-bind-text="contact.copyright" style="font-size:13px;color:var(--fg-45)">© 2026 Rabees Sheikh · Karachi</span>
      <div style="display:flex;flex-wrap:wrap;gap:24px">
        <span data-render="socialsInline" style="display:flex;flex-wrap:wrap;gap:24px"><a href="#" style="font-size:13px;color:var(--fg-60)">Instagram</a>
        <a href="https://www.behance.net/iamrabees" target="_blank" rel="noreferrer" style="font-size:13px;color:var(--fg-60)">Behance</a>
        <a href="https://www.linkedin.com/in/ggrabees" target="_blank" rel="noreferrer" style="font-size:13px;color:var(--fg-60)">LinkedIn</a></span>
        <a href="uploads/Rabees%20Ahmed%20Sheikh%20-%20Resume.pdf" data-bind-href="contact.resume" target="_blank" rel="noreferrer" style="font-size:13px;color:var(--fg-60)">Résumé</a>
      </div>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}"></script>
</body>
</html>
