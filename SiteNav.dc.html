<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --bg:#000; --fg:#fff; --fg-90:rgba(255,255,255,0.9); --fg-80:rgba(255,255,255,0.8); --fg-60:rgba(255,255,255,0.6); --fg-50:rgba(255,255,255,0.5); --fg-45:rgba(255,255,255,0.45); --line:rgba(255,255,255,0.08); --line-strong:rgba(255,255,255,0.3); --btn-bg:#fff; --btn-fg:#000; --menu-bg:rgba(0,0,0,0.98); }
  body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; background: var(--bg); transition: background .4s ease; }
  @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
  a { color: inherit; text-decoration: none; }
  a:hover { color: var(--fg); }
</style>
<script>
(function(){try{if(localStorage.getItem('rs-theme')==='light'){var v={'--bg':'#f4f4f2','--fg':'#0b0b0b','--fg-90':'rgba(11,11,11,0.9)','--fg-80':'rgba(11,11,11,0.75)','--fg-60':'rgba(11,11,11,0.6)','--fg-50':'rgba(11,11,11,0.5)','--fg-45':'rgba(11,11,11,0.45)','--line':'rgba(11,11,11,0.12)','--line-strong':'rgba(11,11,11,0.3)','--btn-bg':'#0b0b0b','--btn-fg':'#f4f4f2','--menu-bg':'rgba(0,0,0,0.98)'};v['--menu-bg']='rgba(244,244,242,0.98)';for(var k in v){document.documentElement.style.setProperty(k,v[k]);}document.documentElement.setAttribute('data-theme','light');}}catch(e){}})();
</script>
</helmet>
<nav style="position:fixed;top:0;left:0;right:0;z-index:45;background:var(--bg);display:flex;align-items:center;justify-content:space-between;min-height:75px;box-sizing:border-box;padding:16px clamp(24px,5vw,64px);font-family:Geist, sans-serif;color:var(--fg);border-bottom:1px solid var(--line);transition:transform .45s cubic-bezier(0.16,1,0.3,1);transform:translateY(0)">
  <div style="display:flex;align-items:center;gap:36px">
    <a href="index.html" style="font-size:clamp(18px,2vw,20px);font-weight:600;letter-spacing:-0.02em;color:var(--fg)">Rabees Sheikh</a>
    <div style="display:{{ desktopNavDisplay }};align-items:center;gap:28px">
      <a href="Work.dc.html" style="font-size:14px;color:var(--fg-80);transition:color .2s" style-hover="color:var(--fg)">Work</a>
      <a href="Capabilities.dc.html" style="font-size:14px;color:var(--fg-80);transition:color .2s" style-hover="color:var(--fg)">Capabilities</a>
      <a href="About.dc.html" style="font-size:14px;color:var(--fg-80);transition:color .2s" style-hover="color:var(--fg)">About</a>
      <a href="Contact.dc.html" style="font-size:14px;color:var(--fg-80);transition:color .2s" style-hover="color:var(--fg)">Contact</a>
    </div>
  </div>
  <a href="https://wa.me/923002883570" data-bind-href="contact.phoneHref" target="_blank" rel="noreferrer" style="display:{{ desktopNavDisplay }};border-radius:8px;background:var(--btn-bg);padding:8px 20px;font-size:14px;font-weight:500;color:var(--btn-fg);transition:transform .2s" style-hover="transform:scale(1.05)">Let's Talk</a>
  <button onClick="{{ toggleMenu }}" aria-label="Toggle menu" style="display:{{ mobileToggleDisplay }};position:relative;z-index:50;flex:none;margin-right:-8px;width:40px;height:40px;align-items:center;justify-content:center;border:0;background:transparent;color:var(--fg);cursor:pointer;transition:transform .15s" style-active="transform:scale(0.9)">
    <span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transition:all .3s;opacity:{{ menuIconOpacity }};transform:{{ menuIconTransform }}">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="6" x2="20" y2="6"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="18" x2="20" y2="18"></line></svg>
    </span>
    <span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transition:all .3s;opacity:{{ closeIconOpacity }};transform:{{ closeIconTransform }}">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>
    </span>
  </button>
</nav>
<div style="height:75px"></div>
<div style="position:fixed;left:0;right:0;top:0;z-index:40;overflow:hidden;background:var(--menu-bg);backdrop-filter:blur(24px);font-family:Geist, sans-serif;transition:height .5s cubic-bezier(0.16,1,0.3,1), opacity .5s cubic-bezier(0.16,1,0.3,1);height:{{ menuHeight }};opacity:{{ menuOpacity }};pointer-events:{{ menuPointerEvents }}">
  <div style="display:flex;height:100svh;flex-direction:column;justify-content:center;gap:22px;padding:0 32px;transition:opacity .5s ease .1s, transform .5s cubic-bezier(0.16,1,0.3,1) .1s;opacity:{{ menuOpacity }};transform:{{ menuInnerTransform }}">
    <a href="Work.dc.html" onClick="{{ closeMenu }}" style="font-size:30px;font-weight:500;color:var(--fg-90)">Work</a>
    <a href="Capabilities.dc.html" onClick="{{ closeMenu }}" style="font-size:30px;font-weight:500;color:var(--fg-90)">Capabilities</a>
    <a href="About.dc.html" onClick="{{ closeMenu }}" style="font-size:30px;font-weight:500;color:var(--fg-90)">About</a>
    <a href="Contact.dc.html" onClick="{{ closeMenu }}" style="font-size:30px;font-weight:500;color:var(--fg-90)">Contact</a>
  </div>
</div>
<button onClick="{{ toggleTheme }}" aria-label="Toggle color theme" style="position:fixed;right:clamp(24px,5vw,64px);bottom:clamp(24px,4vh,40px);z-index:60;display:flex;align-items:center;width:56px;height:30px;flex:none;padding:3px;border-radius:999px;border:1px solid var(--line-strong);background:var(--bg);cursor:pointer">
  <span style="position:absolute;left:9px;top:50%;margin-top:-4px;width:8px;height:8px;border-radius:999px;border:1px solid var(--fg-60)"></span>
  <span style="position:absolute;right:9px;top:50%;margin-top:-4px;width:8px;height:8px;border-radius:999px;background:var(--fg-60)"></span>
  <span style="position:relative;width:22px;height:22px;border-radius:999px;background:var(--fg);transition:transform .35s cubic-bezier(0.16,1,0.3,1);transform:{{ knobTransform }}"></span>
</button>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
const LIGHT = { '--bg':'#f4f4f2', '--fg':'#0b0b0b', '--fg-90':'rgba(11,11,11,0.9)', '--fg-80':'rgba(11,11,11,0.75)', '--fg-60':'rgba(11,11,11,0.6)', '--fg-50':'rgba(11,11,11,0.5)', '--fg-45':'rgba(11,11,11,0.45)', '--line':'rgba(11,11,11,0.12)', '--line-strong':'rgba(11,11,11,0.3)', '--btn-bg':'#0b0b0b', '--btn-fg':'#f4f4f2', '--menu-bg':'rgba(244,244,242,0.98)' };
const DARK = { '--bg':'#000', '--fg':'#fff', '--fg-90':'rgba(255,255,255,0.9)', '--fg-80':'rgba(255,255,255,0.8)', '--fg-60':'rgba(255,255,255,0.6)', '--fg-50':'rgba(255,255,255,0.5)', '--fg-45':'rgba(255,255,255,0.45)', '--line':'rgba(255,255,255,0.08)', '--line-strong':'rgba(255,255,255,0.3)', '--btn-bg':'#fff', '--btn-fg':'#000', '--menu-bg':'rgba(0,0,0,0.98)' };

class Component extends DCLogic {
  state = { open: false, isMobile: false, light: false, navHidden: false };
  apply(light) {
    const r = document.documentElement.style;
    const v = light ? LIGHT : DARK;
    Object.keys(v).forEach(k => r.setProperty(k, v[k]));
    document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark');
    try { localStorage.setItem('rs-theme', light ? 'light' : 'dark'); } catch (e) {}
  }
  componentDidMount() {
    let light = false;
    try { light = localStorage.getItem('rs-theme') === 'light'; } catch (e) {}
    this.setState({ light });
    this.apply(light);
    this.mq = window.matchMedia('(max-width: 767px)');
    this.sync = () => this.setState({ isMobile: this.mq.matches });
    this.sync();
    this.mq.addEventListener('change', this.sync);
    this.frame = () => {
      const y = window.scrollY;
      const nav = this.navEl || (this.navEl = document.querySelector('nav'));
      if (!nav) return;
      if (this.refY == null) this.refY = y;
      if (this.navHidden == null) this.navHidden = false;
      if (y <= 90) { this.navHidden = false; this.refY = y; }
      else if (y > this.refY) { this.navHidden = true; this.refY = y; }
      else if (y < this.refY - 24) { this.navHidden = false; this.refY = y; }
      nav.style.transform = (this.navHidden && !this.state.open) ? 'translateY(-100%)' : 'translateY(0)';
    };
    this.tick = () => { this.frame(); this.raf = requestAnimationFrame(this.tick); };
    this.raf = requestAnimationFrame(this.tick);
  }
  componentWillUnmount() {
    this.mq && this.mq.removeEventListener('change', this.sync);
    cancelAnimationFrame(this.raf);
  }
  renderVals() {
    const { open, isMobile, light } = this.state;
    return {
      desktopNavDisplay: isMobile ? 'none' : 'flex',
      mobileToggleDisplay: isMobile ? 'flex' : 'none',
      menuHeight: open ? '100svh' : '0px',
      menuOpacity: open ? 1 : 0,
      menuPointerEvents: open ? 'auto' : 'none',
      menuInnerTransform: open ? 'translateY(0)' : 'translateY(32px)',
      menuIconOpacity: open ? 0 : 1,
      menuIconTransform: open ? 'rotate(90deg) scale(0.8)' : 'rotate(0deg) scale(1)',
      closeIconOpacity: open ? 1 : 0,
      closeIconTransform: open ? 'rotate(0deg) scale(1)' : 'rotate(-90deg) scale(0.8)',
      knobTransform: light ? 'translateX(26px)' : 'translateX(0)',
      toggleTheme: () => this.setState(s => { const light = !s.light; this.apply(light); return { light }; }),
      toggleMenu: () => this.setState(s => ({ open: !s.open })),
      closeMenu: () => this.setState({ open: false }),
    };
  }
}
</script>
</body>
</html>
